name: Snap Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run unit tests
        run: go test -v ./...
      - name: Install squashfs-tools and build .snap packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
          ./build.sh
          test -f build/wan27_0.1.0_amd64.snap
          test -f build/wan27_0.1.0_arm64.snap
      - name: Upload Snap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wan27-snaps
          path: |
            build/wan27_0.1.0_amd64.snap
            build/wan27_0.1.0_arm64.snap
            build/wan27-linux-amd64
            build/wan27-linux-arm64
      - name: Attach .snap files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "wan27-snap $TAG" --notes "Linux Snap packages (amd64 & arm64) for Wan 2.7 AI CLI (https://wan2-7.io/cli/)."
          gh release upload "$TAG" build/wan27_0.1.0_amd64.snap build/wan27_0.1.0_arm64.snap build/wan27-linux-amd64 build/wan27-linux-arm64 --clobber
